<div class="theme-wrap">
  <button class="theme-btn" (click)="toggleOpen()" [title]="currentTheme().label">◈</button>
  @if (isOpen()) {
    <div class="theme-menu">
      @for (theme of themes(); track theme.name) {
        <button
          class="theme-option"
          [class.active]="theme.name === currentTheme().name"
          (click)="selectTheme(theme.name)"
        >
          <span class="swatch" [style.background]="theme.colorPrimary"></span>
          {{ theme.label }}
        </button>
      }
    </div>
  }
</div>
