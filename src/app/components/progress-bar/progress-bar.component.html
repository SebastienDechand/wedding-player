<div class="progress-row">
  <span class="time-label">{{ audio.formatTime(audio.currentTime()) }}</span>
  <div
    class="progress-track"
    (click)="audio.seekTo($event.offsetX / $any($event.currentTarget).offsetWidth)"
  >
    <div class="progress-fill" [style.width.%]="audio.progressPercent()"></div>
  </div>
  <span class="time-label">{{ audio.formatTime(audio.duration()) }}</span>
</div>
